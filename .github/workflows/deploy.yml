name: Deploy CapRover

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nova-sms-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_API_URL: /api
          VITE_APP_NAME: NovaSMS
          VITE_APP_ENV: production
          VITE_IS_STAGING: 'true'
        run: npm run build

      - name: Pack source (prebuilt dist)
        run: |
          COPYFILE_DISABLE=1 tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.vite' \
            --exclude='./test-results' \
            --exclude='./playwright-report' \
            --exclude='./.github' \
            --exclude='./src' \
            -cf ./deploy.tar \
            Dockerfile \
            captain-definition \
            nginx.conf.template \
            dist \
            package.json \
            index.html

      - name: Install CapRover CLI
        run: npm i -g caprover@2.3.1

      - name: Deploy to CapRover
        run: |
          caprover deploy \
            -u "${{ secrets.CAPROVER_SERVER }}" \
            -a nova-sms-front \
            -t ./deploy.tar \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}"
